name: Luna Update Engine v2 package and installer tests
on:
  pull_request:
    paths:
      - 'kernel/update*'
      - 'kernel/luna.h'
      - 'drivers/net.c'
      - 'net/http_stream.c'
      - 'include/net/http_stream.h'
      - 'tools/updatepack.py'
      - 'tests/update*'
      - '.github/workflows/update-v2-ci.yml'
  push:
    branches: [feat/luna-update-engine-v2]
permissions:
  contents: read
jobs:
  update-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install LunaOS build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake m4 gcc-multilib g++-multilib libc6-dev-i386 clang lld zlib1g-dev libcairo2
          mkdir -p .tools/python build dist
          python3 -m pip install --target .tools/python -r requirements-dev.txt
      - name: Build BIOS/UEFI images
        run: make -j2 all
      - name: Run bundle and failure-injected update tests
        run: make test-update
      - name: Validate native TCP and URL regression tests
        run: make test-tcp test-url
