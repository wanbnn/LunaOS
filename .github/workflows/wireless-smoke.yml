name: Wireless portability smoke tests
on:
  push:
    branches:
      - feat/linux-wireless-port-foundation
  pull_request:
    paths:
      - 'drivers/wifi*'
      - 'drivers/rtw8822be_diag.*'
      - 'ui/setup.c'
      - 'kernel/wifi.h'
      - 'tests/wifi*'
      - 'tests/rtw8822be_diag.c'
      - 'net/wireless/**'
      - 'Makefile'
      - '.github/workflows/wireless-smoke.yml'
jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (simulated PCI, firmware, scan and connect)
        run: make test-wifi-port test-wireless-frames test-wifi-runtime test-rtw8822be-diag
      - name: Build native sources in freestanding i386 mode
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          mkdir -p build/ci
          gcc -m32 -std=gnu11 -O2 -ffreestanding -fno-builtin -fno-pie -mno-sse -msoft-float -Wall -Wextra -Werror -Ikernel -Ibuild -c drivers/wifi.c -o build/ci/wifi.o
          gcc -m32 -std=gnu11 -O2 -ffreestanding -fno-builtin -fno-pie -mno-sse -msoft-float -Wall -Wextra -Werror -Ikernel -Ibuild -c drivers/rtw8822be_diag.c -o build/ci/rtw8822be_diag.o
          gcc -m32 -std=gnu11 -O2 -ffreestanding -fno-builtin -fno-pie -mno-sse -msoft-float -Wall -Wextra -Werror -Ikernel -Ibuild -c ui/setup.c -o build/ci/setup.o
          gcc -m32 -std=gnu11 -O2 -ffreestanding -fno-builtin -fno-pie -mno-sse -msoft-float -Wall -Wextra -Werror -Ikernel -Ibuild -c kernel/main.c -o build/ci/main.o
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install LunaOS build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib clang lld python3-pip
          mkdir -p .tools/python build dist
          python3 -m pip install --target .tools/python -r requirements-dev.txt
      - name: Build LunaOS experimental image and ISO
        run: make -j2 all
      - name: Upload test image (NOT a working Wi-Fi driver)
        uses: actions/upload-artifact@v4
        with:
          name: LunaOS-rtl8822be-diagnostics-experimental
          path: |
            dist/LunaOS.img
            dist/LunaOS.iso
          if-no-files-found: error
          retention-days: 7
