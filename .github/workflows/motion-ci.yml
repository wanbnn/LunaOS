name: Native Motion Engine v2 checks
on:
  pull_request:
    paths:
      - 'ui/motion.c'
      - 'ui/motion.h'
      - 'ui/windows.c'
      - 'ui/settings.c'
      - 'kernel/settings.h'
      - 'tests/motion.c'
      - 'Makefile'
      - '.github/workflows/motion-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ui/motion.c'
      - 'ui/motion.h'
      - 'ui/windows.c'
      - 'ui/settings.c'
      - 'kernel/settings.h'
      - 'tests/motion.c'
      - 'Makefile'
      - '.github/workflows/motion-ci.yml'
permissions:
  contents: read
jobs:
  motion-unit:
    name: Motion tests and i386 compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Motion regression tests (ASan and UBSan)
        run: make test-motion
      - name: Compile freestanding i386 motion implementation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib libc6-dev-i386
          mkdir -p build/ci
          gcc -m32 -std=gnu11 -O2 -ffreestanding -fno-builtin -fno-pie -fno-pic -fno-stack-protector -mno-sse -mno-mmx -msoft-float -Wall -Wextra -Werror -Iui -c ui/motion.c -o build/ci/motion.o
  image-build:
    name: Build ISO and run host checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install LunaOS build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 clang lld cmake zlib1g-dev libcairo2 python3-pip
          mkdir -p .tools/python build dist
          python3 -m pip install --target .tools/python -r requirements-dev.txt
      - name: Build native LunaOS image and ISO
        run: make -j2 all
      - name: Run host regression suite
        run: make check
      - name: Verify generated boot images
        run: |
          test -s dist/LunaOS.img
          test -s dist/LunaOS.iso
          ls -lh dist/LunaOS.img dist/LunaOS.iso
