name: Publish LunaOS update release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luna-update-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'wanbnn/LunaOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386 clang lld zlib1g-dev libcairo2
          mkdir -p .tools/python build dist
          python3 -m pip install --target .tools/python -r requirements-dev.txt
      - name: Build BIOS and UEFI images
        run: make -j2 all
      - name: Verify updater and native network contracts
        run: make test-update test-wifi-runtime test-wifi-scan test-wifi-station
      - name: Package the exact compiled commit
        env:
          UPDATE_COMMIT: ${{ github.sha }}
        run: python3 tools/updatepack.py --commit "$UPDATE_COMMIT"
      - name: Optional differential package from previous published build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          previous_tag="$(gh release list --limit 30 --json tagName,isDraft --jq '[.[] | select(.isDraft == false and (.tagName | startswith("update-")))] | .[0].tagName // ""')"
          if [[ "$previous_tag" =~ ^update-([0-9a-f]{40})$ ]]; then
            previous_commit="${BASH_REMATCH[1]}"
            if [[ "$previous_commit" != "$UPDATE_COMMIT" ]]; then
              mkdir -p build/update-base
              if gh release download "$previous_tag" --pattern LunaOS.img --dir build/update-base; then
                python3 tools/updatepack.py --commit "$UPDATE_COMMIT" --base-commit "$previous_commit" --base-image build/update-base/LunaOS.img
              else
                echo "Previous release image unavailable; publishing the full package only."
              fi
            fi
          fi
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          update_tag="update-$UPDATE_COMMIT"
          if gh release view "$update_tag" --json isDraft --jq '.isDraft' > build/update-draft.txt 2>/dev/null; then
            if [[ "$(cat build/update-draft.txt)" == false ]]; then
              echo 'This commit already has a published update.'
              exit 0
            fi
          else
            gh release create "$update_tag" --draft --target "$UPDATE_COMMIT" \
              --title "LunaOS ${UPDATE_COMMIT:0:12}" --notes-file docs/update-release-notes.md
          fi
          gh release upload "$update_tag" dist/update/*.pack dist/LunaOS.img dist/LunaOS.iso --clobber
          current_head="$(gh api repos/wanbnn/LunaOS/git/ref/heads/main --jq '.object.sha')"
          if [[ "$current_head" == "$UPDATE_COMMIT" ]]; then
            gh release edit "$update_tag" --draft=false --latest
          else
            gh release edit "$update_tag" --draft=false --latest=false
          fi
