name: Luna Browser HTML and DOM
on:
  pull_request:
    paths:
      - 'ui/web_dom.c'
      - 'ui/web_js.c'
      - 'ui/webengine.h'
      - 'tests/webengine_test.c'
      - '.github/workflows/browser-dom.yml'
  push:
    branches:
      - main
    paths:
      - 'ui/web_dom.c'
      - 'ui/web_js.c'
      - 'ui/webengine.h'
      - 'tests/webengine_test.c'
      - '.github/workflows/browser-dom.yml'
jobs:
  webengine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: HTML/DOM regression tests (ASan and UBSan)
        run: make test-webengine
