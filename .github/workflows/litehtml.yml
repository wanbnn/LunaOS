name: Luna litehtml C++ renderer integration
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'Makefile'
      - 'third_party/litehtml'
      - 'ui/litehtml_bridge.h'
      - 'ui/web_dom_types.h'
      - 'kernel/link.ld'
      - 'kernel/main.c'
      - 'ui/litehtml_bridge.cpp'
      - 'ui/web_view.c'
      - 'ui/litehtml_graphics.c'
      - 'tools/litehtml-float-progress.patch'
      - 'tools/litehtml-float-width.patch'
      - 'tools/litehtml-grid.patch'
      - 'lib/cxx_runtime.cpp'
      - 'lib/runtime.c'
      - 'lib/cxx_glibc_compat.c'
      - 'tests/litehtml_bridge_test.cpp'
      - 'tests/litehtml_float_test.cpp'
      - '.github/workflows/litehtml.yml'
  push:
    branches:
      - main
jobs:
  host-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install 32-bit C/C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386
      - name: Verify freestanding C++ ABI and native graphics callbacks
        run: |
          mkdir -p build/ui build/lib
          g++ -m32 -std=c++17 -ffreestanding -fno-exceptions -fno-rtti -fno-pie -fno-stack-protector -c lib/cxx_runtime.cpp -o build/lib/cxx_runtime.o
          gcc -m32 -std=gnu11 -ffreestanding -fno-builtin -fno-pie -fno-stack-protector -Ikernel -Ibuild -Iui -c ui/litehtml_graphics.c -o build/ui/litehtml_graphics.o
          file build/lib/cxx_runtime.o build/ui/litehtml_graphics.o
      - name: Build i386 litehtml static objects
        run: |
          test -f "$(g++ -m32 -print-file-name=libstdc++.a)"
          make litehtml-native
          file build/litehtml-native/patched/liblitehtml.a build/ui/litehtml_bridge.o build/lib/cxx_runtime.o
      - name: Link the default renderer into the LunaOS kernel
        run: |
          python3 -m pip install --target .tools/python -r requirements-dev.txt
          make build/kernel.elf
      - name: Verify flexbox, grid, floats and graphics callbacks
        run: make test-litehtml
