name: Luna litehtml C++ renderer integration
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'third_party/litehtml'
      - 'ui/litehtml_bridge.h'
      - 'ui/litehtml_bridge.cpp'
      - 'ui/litehtml_graphics.c'
      - 'lib/cxx_runtime.cpp'
      - 'tests/litehtml_bridge_test.cpp'
      - '.github/workflows/litehtml.yml'
  push:
    branches:
      - main
jobs:
  host-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install 32-bit C/C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386
      - name: Verify freestanding C++ ABI and native graphics callbacks
        run: |
          mkdir -p build/ui build/lib
          g++ -m32 -std=c++17 -ffreestanding -fno-exceptions -fno-rtti -fno-pie -fno-stack-protector -c lib/cxx_runtime.cpp -o build/lib/cxx_runtime.o
          gcc -m32 -std=gnu11 -ffreestanding -fno-builtin -fno-pie -fno-stack-protector -Ikernel -Ibuild -Iui -c ui/litehtml_graphics.c -o build/ui/litehtml_graphics.o
          file build/lib/cxx_runtime.o build/ui/litehtml_graphics.o
      - name: Build pinned litehtml v0.10 with C++17 runtime
        run: |
          cmake -S third_party/litehtml -B build/litehtml-host -DCMAKE_BUILD_TYPE=Release -DLITEHTML_BUILD_TESTING=OFF
          cmake --build build/litehtml-host --parallel 2
      - name: Compile Luna C ABI container with warnings as errors
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Ithird_party/litehtml/include -Ithird_party/litehtml/src -c ui/litehtml_bridge.cpp -o build/litehtml-bridge.o
      - name: Flexbox layout and graphics callback smoke test
        run: |
          find build/litehtml-host -name '*.a' -print
          c++ -std=c++17 -Ithird_party/litehtml/include -Ithird_party/litehtml/src tests/litehtml_bridge_test.cpp build/litehtml-bridge.o build/litehtml-host/liblitehtml.a build/litehtml-host/src/gumbo/libgumbo.a -o build/litehtml-bridge-test
          ./build/litehtml-bridge-test
